<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MONITOR — Painel de Licenças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05080a;
    --bg-panel: rgba(9,16,18,.78);
    --bg-panel-solid:#0b1315;
    --border-soft: rgba(255,255,255,.07);
    --border-glow: rgba(45,226,192,.35);
    --cyan:#2de2c0;
    --cyan-bright:#7dffe6;
    --cyan-dim:#0f5c50;
    --amber:#ffb020;
    --ink:#e7f3f1;
    --ink-dim:#9fb3b0;
    --ink-faint:#5f7472;
    --green-ok:#33d977;
    --red-status:#ff4b4b;
    --radius:12px;
    --radius-sm:8px;
    --shadow-deep: 0 20px 60px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 20% -10%, rgba(45,226,192,.08), transparent 60%),
      radial-gradient(900px 600px at 90% 110%, rgba(255,176,32,.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 3px),
      var(--bg-0);
    color:var(--ink);
    font-family:'Inter',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}

  .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .brand-mark{
    width:44px;height:44px;border-radius:10px;
    background:linear-gradient(160deg, rgba(45,226,192,.18), rgba(45,226,192,.02));
    border:1px solid var(--border-glow);
    display:flex;align-items:center;justify-content:center;
    position:relative;flex-shrink:0;
  }
  .brand-mark::before{
    content:"";width:14px;height:14px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 14px 3px rgba(45,226,192,.7);
  }
  .brand h1{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;letter-spacing:.06em;margin:0;color:var(--ink);
  }
  .brand p{margin:2px 0 0;color:var(--ink-faint);font-size:12.5px;font-family:'JetBrains Mono',monospace}

  .card{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
    box-shadow:var(--shadow-deep);
    backdrop-filter: blur(6px);
  }
  .card::before,.card::after{
    content:"";position:absolute;width:14px;height:14px;
    border-color:var(--border-glow);border-style:solid;opacity:.8;
  }
  .card::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-top-left-radius:6px}
  .card::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:6px}

  h2{font-size:15px;margin:0 0 4px;color:var(--cyan-bright);font-family:'JetBrains Mono',monospace;letter-spacing:.03em}
  .card p.desc{color:var(--ink-dim);font-size:13px;margin:0 0 14px}

  label{display:block;color:var(--ink-dim);font-size:12px;margin:14px 0 6px;font-family:'JetBrains Mono',monospace}
  input,select,button{
    width:100%;border-radius:var(--radius-sm);
    border:1px solid var(--border-soft);
    padding:12px 13px;background:#040b0c;color:var(--ink);font-size:14.5px;
    font-family:'Inter',Arial,sans-serif;
  }
  input:focus,select:focus{outline:none;border-color:var(--border-glow);box-shadow:0 0 0 3px rgba(45,226,192,.12)}
  button{
    background:var(--cyan);color:#04201b;border:0;font-weight:700;cursor:pointer;
    margin-top:14px;letter-spacing:.02em;transition:filter .15s ease;
  }
  button:hover{filter:brightness(1.08)}
  button.secondary{background:transparent;color:var(--ink-dim);border:1px solid var(--border-soft)}
  button.secondary:hover{border-color:var(--border-glow);color:var(--cyan-bright)}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:600px){.row{grid-template-columns:1fr}}

  .key{
    font-family:'JetBrains Mono',monospace;
    font-size:21px;font-weight:700;letter-spacing:1.5px;
    background:#03090a;border:1px dashed var(--border-glow);
    color:var(--cyan-bright);
    padding:14px;border-radius:var(--radius-sm);
    word-break:break-all;text-align:center;cursor:pointer;
  }
  .hidden{display:none}
  .msg{padding:9px 11px;border-radius:8px;margin-top:10px;background:#0b1a19;color:var(--ink-dim);font-size:13px;font-family:'JetBrains Mono',monospace}
  .item{padding:12px 0;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .item:last-child{border-bottom:0}
  .item b{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink)}
  .small{font-size:11.5px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--green-ok);box-shadow:0 0 6px var(--green-ok)}
  .dot.off{background:var(--red-status);box-shadow:0 0 6px var(--red-status)}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <h1>MONITOR</h1>
      <p>painel de licenças</p>
    </div>
  </div>

  <div class="card" id="loginCard">
    <h2>Acesso</h2>
    <p class="desc">Autentique com o ADMIN_SECRET para gerenciar as licenças.</p>
    <div id="login">
      <label>ADMIN_SECRET</label>
      <input id="secret" type="password" placeholder="Digite a senha do ADMIN_SECRET" autocomplete="current-password">
      <button onclick="login()">Entrar</button>
      <div id="loginMsg"></div>
    </div>
    <div id="panel" class="hidden">
      <button class="secondary" onclick="logout()">Sair</button>
    </div>
  </div>

  <div id="content" class="hidden">
    <div class="card">
      <h2>Key automática</h2>
      <p class="desc">Gera no formato <b style="color:var(--ink)">MONITOR-9DEB3</b>.</p>
      <div class="row">
        <div><label>Validade</label><select id="autoDays"><option value="30">30 dias</option><option value="7">7 dias</option><option value="90">90 dias</option><option value="365">1 ano</option><option value="0">Permanente</option></select></div>
        <div><label>Produto</label><input id="autoProduct" value="MONITOR"></div>
      </div>
      <button onclick="createAuto()">Gerar key automática</button>
      <div id="autoResult" class="hidden"></div>
    </div>

    <div class="card">
      <h2>Key personalizada</h2>
      <p class="desc">Digite sua própria key. Ex.: <b style="color:var(--ink)">MONITOR-MIGUEL01</b></p>
      <label>Key personalizada</label><input id="customKey" placeholder="MONITOR-MINHAKEY">
      <div class="row">
        <div><label>Validade</label><select id="customDays"><option value="30">30 dias</option><option value="7">7 dias</option><option value="90">90 dias</option><option value="365">1 ano</option><option value="0">Permanente</option></select></div>
        <div><label>Produto</label><input id="customProduct" value="MONITOR"></div>
      </div>
      <button onclick="createCustom()">Criar key personalizada</button>
      <div id="customResult" class="hidden"></div>
    </div>

    <div class="card">
      <h2>Keys cadastradas</h2>
      <button class="secondary" onclick="loadKeys()">Atualizar lista</button>
      <div id="list" class="small" style="margin-top:12px">Carregando...</div>
    </div>
  </div>
</div>

<script>
let secret=localStorage.getItem('monitor_admin_secret')||'';
const $=id=>document.getElementById(id);
function setMsg(id,text,show=true){$(id).innerHTML=text;$(id).classList.toggle('hidden',!show)}

function genShortKey(prefix){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let block='';
  const bytes=new Uint8Array(5);
  crypto.getRandomValues(bytes);
  for(let i=0;i<5;i++) block+=chars[bytes[i]%chars.length];
  return prefix+'-'+block;
}

async function api(method='GET',body){
 const r=await fetch('/api/admin/keys',{method,headers:{'x-admin-secret':secret,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 let d={};try{d=await r.json()}catch{}
 if(!r.ok) throw new Error(d.reason||'Erro na requisição'); return d;
}
async function login(){
 secret=$('secret').value.trim(); if(!secret)return setMsg('loginMsg','Digite o ADMIN_SECRET.');
 try{await api();localStorage.setItem('monitor_admin_secret',secret);showPanel();}catch(e){setMsg('loginMsg','❌ '+e.message)}}
function showPanel(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('content').classList.remove('hidden');loadKeys()}
function logout(){localStorage.removeItem('monitor_admin_secret');secret='';location.reload()}
async function createAuto(){
 try{
   const shortKey=genShortKey('MONITOR');
   const d=await api('POST',{key:shortKey,days:Number($('autoDays').value),product:$('autoProduct').value});
   showResult('autoResult',d.key.key)
 }catch(e){setMsg('autoResult','❌ '+e.message)}}
async function createCustom(){
 const key=$('customKey').value.trim();if(!key)return setMsg('customResult','Digite a key personalizada.');
 try{const d=await api('POST',{key,days:Number($('customDays').value),product:$('customProduct').value});showResult('customResult',d.key.key);$('customKey').value=''}catch(e){setMsg('customResult','❌ '+e.message)}}
function showResult(id,key){$(id).classList.remove('hidden');$(id).innerHTML='<div class="msg">Key criada</div><div class="key" onclick="copyKey(this)">'+esc(key)+'</div><div class="small" style="text-align:center;margin-top:7px">toque na key para copiar</div>'}
async function copyKey(el){try{await navigator.clipboard.writeText(el.textContent);el.nextElementSibling.textContent='✓ copiada'}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadKeys(){
 try{
   const d=await api();
   $('list').innerHTML=d.keys.length?d.keys.map(k=>{
     const active=!k.revoked;
     return '<div class="item"><div><b>'+esc(k.key)+'</b><br><span class="small">'+esc(k.product)+' · '+(k.expiresAt?new Date(k.expiresAt).toLocaleString('pt-BR'):'permanente')+'</span></div><span class="small"><span class="dot '+(active?'on':'off')+'"></span>'+(active?'ativa':'revogada')+'</span></div>';
   }).join(''):'Nenhuma key cadastrada.';
 }catch(e){$('list').textContent='❌ '+e.message}
}
if(secret){api().then(showPanel).catch(()=>{localStorage.removeItem('monitor_admin_secret');secret=''})}
</script>
</body>
</html>
